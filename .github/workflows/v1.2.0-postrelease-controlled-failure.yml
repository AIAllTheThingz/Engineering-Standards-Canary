name: v1.2.0 PostRelease Canary - controlled-failure

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - release/v1.2.0-postrelease-canary

permissions:
  contents: read

jobs:
  scenario:
    name: Published-ref controlled failure
    uses: AIAllTheThingz/Engineering-Standards/.github/workflows/governance-ci-reusable.yml@v1.2.0
    with:
      project-path: .
      governance-version: 1.1.0
      artifact-retention-days: 30
      controlled-failure-test: true
