name: v1.2.0 PostRelease Canary - success

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - release/v1.2.0-postrelease-canary

permissions:
  contents: read

jobs:
  repository_shape:
    name: Repository shape
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canary
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Prove central implementation directories are absent
        shell: bash
        run: |
          set -euo pipefail
          for forbidden in scripts actions tests examples; do
            if git ls-tree -d -r --name-only HEAD | awk -F/ -v name="${forbidden}" '$NF == name { found=1 } END { exit !found }'; then
              echo "Forbidden copied central directory found: ${forbidden}" >&2
              exit 1
            fi
          done

  scenario:
    name: Published-ref success
    needs: repository_shape
    uses: AIAllTheThingz/Engineering-Standards/.github/workflows/governance-ci-reusable.yml@v1.2.0
    with:
      project-path: .
      governance-version: 1.1.0
      artifact-retention-days: 30
